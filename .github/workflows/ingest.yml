name: Ingest schedule

# Every 30 minutes (GitHub may delay scheduled runs by 5-30 min; harmless,
# since calendar apps refresh far less often). Also runnable by hand.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Direct (unpooled) connection: migrations and ingest use transactions
      # and advisory locks.
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check database secret
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL_UNPOOLED secret not set yet; skipping ingest."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secret.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.secret.outputs.ready == 'true'
        run: uv sync --locked --no-dev
      - if: steps.secret.outputs.ready == 'true'
        run: uv run --no-dev python -m fixturefeed.db
      - if: steps.secret.outputs.ready == 'true'
        run: uv run --no-dev python -m fixturefeed.ingest
