{% extends "base.html" %}
{% block content %}
<h1>{{ app_name }}</h1>
<p class="lede">Your NFL team's schedule in your calendar. When a game moves, the event updates instead of duplicating.</p>
<form class="card" method="post" action="/feeds">
  <label for="team">Team</label>
  <select id="team" name="team" required>
    <option value="" disabled selected>Choose a team…</option>
    {% for abbr, name in teams %}<option value="{{ abbr }}">{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Get my calendar link</button>
</form>
{% endblock %}
