<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #5f6368; --bg: #fafafa; --card: #fff; --line: #e0e0e0; --accent: #1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e8e8; --muted: #a0a0a0; --bg: #161616; --card: #1f1f1f; --line: #333; --accent: #78aeed; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    p.lede { color: var(--muted); margin: 0 0 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    select, input[type=text] { width: 100%; font: inherit; padding: .55rem; border: 1px solid var(--line);
                               border-radius: 6px; background: var(--bg); color: var(--fg); }
    button, a.button { display: inline-block; margin-top: 1rem; font: inherit; font-weight: 600; padding: .55rem 1rem;
                       border: 0; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
    fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
    legend { font-weight: 600; margin-bottom: .3rem; }
    label.opt { display: block; font-weight: 400; margin: .25rem 0; }
    label.opt input { margin-right: .4rem; }
    p.tag { display: inline-block; margin: 0 0 1rem; padding: .1rem .6rem; border-radius: 99px;
            border: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    ol { padding-left: 1.2rem; } li { margin: .3rem 0; }
    small { color: var(--muted); }
    a { color: var(--accent); }
    ol.history { list-style: none; padding: 0; }
    ol.history > li { margin: 0 0 .75rem; }
    ol.history h2 { font-size: 1.05rem; margin: .2rem 0; }
    ol.history ul { margin: .3rem 0; padding-left: 1.1rem; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
